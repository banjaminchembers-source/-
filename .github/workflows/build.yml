name: Build Cookie Dimon APK
on:
  push:
    branches: [main, cookie-wave-mascot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Generate Android platform and add floating mascot
        shell: bash
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/cookie-AndroidManifest.xml
          flutter create --platforms=android --org com.example --project-name dimon_assistant /tmp/cookie-scaffold
          rm -rf android
          cp -R /tmp/cookie-scaffold/android ./android
          cp /tmp/cookie-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/example/dimon_assistant
          cp android-src/com/example/dimon_assistant/*.kt android/app/src/main/kotlin/com/example/dimon_assistant/
      - name: Configure Android SDK levels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion','compileSdk = 36',s)
          s=re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion','minSdk = 24',s)
          p.write_text(s)
          PY
      - run: flutter pub get
      - name: Build release APK
        env:
          APP_API_BASE_URL: ${{ secrets.APP_API_BASE_URL }}
        shell: bash
        run: |
          if [ -n "$APP_API_BASE_URL" ]; then
            flutter build apk --release --dart-define=APP_API_BASE_URL="$APP_API_BASE_URL"
          else
            flutter build apk --release
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cookie-dimon-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
